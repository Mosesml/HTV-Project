<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Active session</title>
</head>
<body>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C9B8FF}a:hover{color:#E6DDFF}
</style>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 56px 24px 32px; background: #14122B; color: #F4F1FF; font-family: Manrope, system-ui, sans-serif; display: flex; flex-direction: column; gap: 18px">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <div style="display: flex; align-items: center; gap: 10px; background: #1F1C3D; border: 1px solid #2F2B5C; border-radius: 999px; padding: 8px 14px 8px 12px">
      <span style="width: 9px; height: 9px; border-radius: 5px; background: #A6EBCF"></span>
      <span style="font-size: 14px; font-weight: 600">Session live</span>
      <span style="font-size: 14px; color: #B7B0DC; font-variant-numeric: tabular-nums">1h 42m</span>
    </div>
    <a href="Debug.html" aria-label="Debug panel" style="width: 44px; height: 44px; border-radius: 14px; border: 1px solid #3B3770; background: #1F1C3D; color: #F4F1FF; display: flex; align-items: center; justify-content: center; box-sizing: border-box">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M7 9l3 3-3 3M13 15h4"></path></svg>
    </a>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px; padding: 6px 0 2px">
    <span style="font-size: 13px; font-weight: 600; color: #B7B0DC; letter-spacing: 0.04em; text-transform: uppercase">Right now</span>
    <span style="font-family: Sora, sans-serif; font-size: 44px; line-height: 1; font-weight: 600; letter-spacing: -0.03em; color: #C9B8FF">Dancing</span>
    <span style="font-size: 15px; color: #B7B0DC">Next check-in in <span style="color: #F4F1FF; font-weight: 700; font-variant-numeric: tabular-nums">12:40</span></span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 18px; background: #1F1C3D; border: 1px solid #2F2B5C; border-radius: 22px; padding: 18px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <span style="font-family: Sora, sans-serif; font-size: 16px; font-weight: 600">Hearing</span>
      <span style="font-size: 12px; color: #B7B0DC">Estimates, not a medical reading</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <div style="display: flex; flex-direction: column; gap: 4px; background: #2A2752; border-radius: 16px; padding: 14px">
        <span style="font-size: 12px; color: #B7B0DC; font-weight: 600">Room</span>
        <span style="font-family: Sora, sans-serif; font-size: 30px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -0.02em">98<span style="font-size: 15px; color: #B7B0DC; font-weight: 500"> dB</span></span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px; background: #2A2752; border-radius: 16px; padding: 14px">
        <span style="font-size: 12px; color: #B7B0DC; font-weight: 600">In your ears</span>
        <span style="font-family: Sora, sans-serif; font-size: 30px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; color: #A4CCFF">~76<span style="font-size: 15px; color: #B7B0DC; font-weight: 500"> dB</span></span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <span style="font-size: 14px; font-weight: 600">Tonight's dose</span>
        <span style="font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums">46%</span>
      </div>
      <div style="height: 10px; border-radius: 5px; background: #2A2752; overflow: hidden" role="img" aria-label="Dose 46 percent of a safe daily amount">
        <div style="width: 46%; height: 10px; border-radius: 5px; background: #C9B8FF"></div>
      </div>
      <span style="font-size: 12px; color: #B7B0DC">100% is a full day's safe exposure. Protection floor has risen to 45.</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <label for="prot" style="font-size: 14px; font-weight: 600">Protection</label>
        <span style="font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums">72</span>
      </div>
      <input id="prot" type="range" min="0" max="100" value="72" style="width: 100%; height: 28px; margin: 0; accent-color: #C9B8FF">
      <div style="display: flex; justify-content: space-between; font-size: 12px; color: #B7B0DC">
        <span>Hear more</span>
        <span>Filter more</span>
      </div>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <div style="display: flex; align-items: center; gap: 10px; background: #1F1C3D; border: 1px solid #2F2B5C; border-radius: 16px; padding: 12px 14px">
      <span style="width: 8px; height: 8px; border-radius: 4px; background: #A6EBCF; flex-shrink: 0"></span>
      <div style="display: flex; flex-direction: column; gap: 1px">
        <span style="font-size: 13px; font-weight: 600">AirPods</span>
        <span style="font-size: 12px; color: #B7B0DC">Connected</span>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; background: #1F1C3D; border: 1px solid #2F2B5C; border-radius: 16px; padding: 12px 14px">
      <span style="width: 8px; height: 8px; border-radius: 4px; background: #A6EBCF; flex-shrink: 0"></span>
      <div style="display: flex; flex-direction: column; gap: 1px">
        <span style="font-size: 13px; font-weight: 600">Bridge</span>
        <span style="font-size: 12px; color: #B7B0DC">Adaptive · 72</span>
      </div>
    </div>
  </div>

  <div style="flex-grow: 1"></div>

  <button style="height: 64px; border-radius: 22px; border: 1.5px solid #4A4585; background: #1F1C3D; color: #F4F1FF; font-family: Sora, sans-serif; font-size: 18px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px">
    <span style="width: 14px; height: 14px; border-radius: 3px; background: #FFB0A3"></span>
    Stop session
  </button>
</div>
</body>
</html>
