<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Setup – your night</title>
</head>
<body>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C9B8FF}a:hover{color:#E6DDFF}
</style>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 56px 24px 32px; background: #14122B; color: #F4F1FF; font-family: Manrope, system-ui, sans-serif; display: flex; flex-direction: column; gap: 22px">
  <div style="display: flex; flex-direction: column; gap: 12px">
    <span style="font-size: 13px; font-weight: 600; color: #B7B0DC; letter-spacing: 0.04em; text-transform: uppercase">Step 3 of 4</span>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
      <span style="height: 4px; border-radius: 2px; background: #C9B8FF"></span>
      <span style="height: 4px; border-radius: 2px; background: #C9B8FF"></span>
      <span style="height: 4px; border-radius: 2px; background: #C9B8FF"></span>
      <span style="height: 4px; border-radius: 2px; background: #3B3770"></span>
    </div>
  </div>

  <h1 style="margin: 0; font-family: Sora, sans-serif; font-size: 28px; line-height: 1.15; font-weight: 600; letter-spacing: -0.02em">Your night</h1>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <span style="font-size: 14px; font-weight: 600">Check in with me every</span>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; background: #1F1C3D; border: 1px solid #2F2B5C; border-radius: 16px; padding: 5px">
      <button aria-pressed="true" style="height: 44px; border-radius: 12px; border: none; background: #C9B8FF; color: #1A1638; font-family: Manrope, sans-serif; font-size: 15px; font-weight: 700">30 min</button>
      <button aria-pressed="false" style="height: 44px; border-radius: 12px; border: none; background: transparent; color: #F4F1FF; font-family: Manrope, sans-serif; font-size: 15px; font-weight: 600">60 min</button>
    </div>
    <span style="font-size: 12px; color: #B7B0DC">Falls and long stillness trigger a check-in at any time too.</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <span style="font-size: 14px; font-weight: 600">How loud is okay?</span>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; background: #1F1C3D; border: 1px solid #2F2B5C; border-radius: 16px; padding: 5px">
      <button aria-pressed="false" style="height: 44px; border-radius: 12px; border: none; background: transparent; color: #F4F1FF; font-family: Manrope, sans-serif; font-size: 15px; font-weight: 600">Quieter</button>
      <button aria-pressed="true" style="height: 44px; border-radius: 12px; border: none; background: #A4CCFF; color: #1A1638; font-family: Manrope, sans-serif; font-size: 15px; font-weight: 700">Balanced</button>
      <button aria-pressed="false" style="height: 44px; border-radius: 12px; border: none; background: transparent; color: #F4F1FF; font-family: Manrope, sans-serif; font-size: 15px; font-weight: 600">Louder</button>
    </div>
    <span style="font-size: 12px; color: #B7B0DC">Protection still rises through the night as your dose adds up.</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <label for="wear" style="font-size: 14px; font-weight: 600">What you're wearing</label>
    <input id="wear" type="text" value="Black hoodie, white cap" style="height: 52px; box-sizing: border-box; border-radius: 16px; border: 1px solid #3B3770; background: #1F1C3D; color: #F4F1FF; font-family: Manrope, sans-serif; font-size: 16px; padding: 0 16px">
    <span style="font-size: 12px; color: #B7B0DC">Helps a friend spot you in a crowd.</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <label for="spot" style="font-size: 14px; font-weight: 600">Meeting spot <span style="font-weight: 500; color: #B7B0DC">(optional)</span></label>
    <input id="spot" type="text" placeholder="e.g. left of the main stage, by the bar" style="height: 52px; box-sizing: border-box; border-radius: 16px; border: 1px solid #3B3770; background: #1F1C3D; color: #F4F1FF; font-family: Manrope, sans-serif; font-size: 16px; padding: 0 16px">
    <span style="font-size: 12px; color: #B7B0DC">Indoor GPS can be off by a block. This goes in the alert.</span>
  </div>

  <div style="flex-grow: 1"></div>

  <div style="display: flex; gap: 12px">
    <button aria-label="Back" style="width: 60px; height: 60px; border-radius: 20px; border: 1px solid #3B3770; background: #1F1C3D; color: #F4F1FF; display: flex; align-items: center; justify-content: center; padding: 0; flex-shrink: 0">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </button>
    <button style="flex-grow: 1; height: 60px; border-radius: 20px; border: none; background: #C9B8FF; color: #1A1638; font-family: Sora, sans-serif; font-size: 17px; font-weight: 600">Next: your PINs</button>
  </div>
</div>
</body>
</html>
