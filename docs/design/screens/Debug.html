<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Debug panel</title>
</head>
<body>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C9B8FF}a:hover{color:#E6DDFF}
</style>
<div style="width: 390px; height: 1180px; box-sizing: border-box; padding: 56px 24px 32px; background: #14122B; color: #F4F1FF; font-family: Manrope, system-ui, sans-serif; display: flex; flex-direction: column; gap: 22px">
  <div style="display: flex; align-items: center; gap: 12px">
    <a href="Active.html" aria-label="Back to session" style="width: 44px; height: 44px; border-radius: 14px; border: 1px solid #3B3770; background: #1F1C3D; color: #F4F1FF; display: flex; align-items: center; justify-content: center; box-sizing: border-box; flex-shrink: 0">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <h1 style="margin: 0; flex-grow: 1; font-family: Sora, sans-serif; font-size: 26px; font-weight: 600; letter-spacing: -0.02em">Debug</h1>
    <span style="background: #2E2A1E; color: #FFC79A; border-radius: 999px; padding: 6px 10px; font-size: 12px; font-weight: 700">Simulated</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px; background: #1F1C3D; border: 1px solid #2F2B5C; border-radius: 20px; padding: 16px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <span style="font-size: 14px; font-weight: 700">Live head motion</span>
      <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #A6EBCF; font-weight: 600"><span style="width: 7px; height: 7px; border-radius: 4px; background: #A6EBCF"></span>10 Hz</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; font-family: 'JetBrains Mono', monospace">
      <div style="background: #2A2752; border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 11px; color: #B7B0DC">pitch</span>
        <span style="font-size: 18px; font-weight: 600">12.4°</span>
      </div>
      <div style="background: #2A2752; border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 11px; color: #B7B0DC">roll</span>
        <span style="font-size: 18px; font-weight: 600">-3.1°</span>
      </div>
      <div style="background: #2A2752; border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 11px; color: #B7B0DC">|accel|</span>
        <span style="font-size: 18px; font-weight: 600">1.02 g</span>
      </div>
      <div style="background: #2A2752; border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 11px; color: #B7B0DC">state</span>
        <span style="font-size: 18px; font-weight: 600; color: #C9B8FF">dancing</span>
      </div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <span style="font-size: 14px; font-weight: 700">Timings</span>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; background: #1F1C3D; border: 1px solid #2F2B5C; border-radius: 16px; padding: 5px">
      <button aria-pressed="true" style="height: 44px; border-radius: 12px; border: none; background: #C9B8FF; color: #1A1638; font-family: Manrope, sans-serif; font-size: 14px; font-weight: 700">Demo · 95 s to SOS</button>
      <button aria-pressed="false" style="height: 44px; border-radius: 12px; border: none; background: transparent; color: #F4F1FF; font-family: Manrope, sans-serif; font-size: 14px; font-weight: 600">Real · 7 min</button>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <span style="font-size: 14px; font-weight: 700">Noise control</span>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; background: #1F1C3D; border: 1px solid #2F2B5C; border-radius: 16px; padding: 5px">
      <button aria-pressed="true" style="height: 44px; border-radius: 12px; border: none; background: #A4CCFF; color: #1A1638; font-family: Manrope, sans-serif; font-size: 14px; font-weight: 700">Bridge</button>
      <button aria-pressed="false" style="height: 44px; border-radius: 12px; border: none; background: transparent; color: #F4F1FF; font-family: Manrope, sans-serif; font-size: 14px; font-weight: 600">Shortcuts</button>
      <button aria-pressed="false" style="height: 44px; border-radius: 12px; border: none; background: transparent; color: #F4F1FF; font-family: Manrope, sans-serif; font-size: 14px; font-weight: 600">Off</button>
    </div>
  </div>

  <div style="display: flex; align-items: center; justify-content: space-between; background: #1F1C3D; border: 1px solid #2F2B5C; border-radius: 16px; padding: 12px 16px">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 14px; font-weight: 700">Simulate offline</span>
      <span style="font-size: 12px; color: #B7B0DC">Backup if airplane mode fails on stage</span>
    </div>
    <button aria-label="Simulate offline" aria-pressed="false" style="width: 52px; height: 32px; border-radius: 16px; border: none; background: #3B3770; padding: 4px; display: flex; justify-content: flex-start; flex-shrink: 0"><span style="width: 24px; height: 24px; border-radius: 12px; background: #8F88BD"></span></button>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <span style="font-size: 14px; font-weight: 700">Fire a scenario</span>
      <button style="width: 100%; min-height: 60px; border-radius: 16px; border: 1px solid #2F2B5C; background: #1F1C3D; color: #F4F1FF; display: flex; align-items: center; gap: 14px; padding: 10px 14px; text-align: left; font-family: Manrope, sans-serif">
        <span style="width: 34px; height: 34px; border-radius: 11px; background: #2A2752; color: #C9B8FF; font-family: Sora, sans-serif; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0">1</span>
        <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 15px; font-weight: 700">Safe</span>
          <span style="font-size: 12px; color: #B7B0DC">Check-in fires, wearer nods, logged only</span>
        </span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C9B8FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 5l11 7-11 7z"></path></svg>
      </button>
      <button style="width: 100%; min-height: 60px; border-radius: 16px; border: 1px solid #2F2B5C; background: #1F1C3D; color: #F4F1FF; display: flex; align-items: center; gap: 14px; padding: 10px 14px; text-align: left; font-family: Manrope, sans-serif">
        <span style="width: 34px; height: 34px; border-radius: 11px; background: #2A2752; color: #C9B8FF; font-family: Sora, sans-serif; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0">2</span>
        <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 15px; font-weight: 700">No response</span>
          <span style="font-size: 12px; color: #B7B0DC">Fall, then every prompt ignored</span>
        </span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C9B8FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 5l11 7-11 7z"></path></svg>
      </button>
      <button style="width: 100%; min-height: 60px; border-radius: 16px; border: 1px solid #2F2B5C; background: #1F1C3D; color: #F4F1FF; display: flex; align-items: center; gap: 14px; padding: 10px 14px; text-align: left; font-family: Manrope, sans-serif">
        <span style="width: 34px; height: 34px; border-radius: 11px; background: #2A2752; color: #C9B8FF; font-family: Sora, sans-serif; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0">3</span>
        <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 15px; font-weight: 700">Duress</span>
          <span style="font-size: 12px; color: #B7B0DC">Duress PIN looks like a cancel</span>
        </span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C9B8FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 5l11 7-11 7z"></path></svg>
      </button>
      <button style="width: 100%; min-height: 60px; border-radius: 16px; border: 1px solid #2F2B5C; background: #1F1C3D; color: #F4F1FF; display: flex; align-items: center; gap: 14px; padding: 10px 14px; text-align: left; font-family: Manrope, sans-serif">
        <span style="width: 34px; height: 34px; border-radius: 11px; background: #2A2752; color: #C9B8FF; font-family: Sora, sans-serif; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0">4</span>
        <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 15px; font-weight: 700">Connectivity failure</span>
          <span style="font-size: 12px; color: #B7B0DC">Phone goes offline mid-countdown</span>
        </span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C9B8FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 5l11 7-11 7z"></path></svg>
      </button>
      <button style="width: 100%; min-height: 60px; border-radius: 16px; border: 1px solid #2F2B5C; background: #1F1C3D; color: #F4F1FF; display: flex; align-items: center; gap: 14px; padding: 10px 14px; text-align: left; font-family: Manrope, sans-serif">
        <span style="width: 34px; height: 34px; border-radius: 11px; background: #2A2752; color: #C9B8FF; font-family: Sora, sans-serif; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0">5</span>
        <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 15px; font-weight: 700">Unacknowledged</span>
          <span style="font-size: 12px; color: #B7B0DC">Maya never answers, Theo is texted</span>
        </span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C9B8FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 5l11 7-11 7z"></path></svg>
      </button>
      <button style="width: 100%; min-height: 60px; border-radius: 16px; border: 1px solid #2F2B5C; background: #1F1C3D; color: #F4F1FF; display: flex; align-items: center; gap: 14px; padding: 10px 14px; text-align: left; font-family: Manrope, sans-serif">
        <span style="width: 34px; height: 34px; border-radius: 11px; background: #2A2752; color: #C9B8FF; font-family: Sora, sans-serif; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0">6</span>
        <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 15px; font-weight: 700">False alarm</span>
          <span style="font-size: 12px; color: #B7B0DC">A contact marks it resolved</span>
        </span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C9B8FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 5l11 7-11 7z"></path></svg>
      </button>
      <button style="width: 100%; min-height: 60px; border-radius: 16px; border: 1px solid #2F2B5C; background: #1F1C3D; color: #F4F1FF; display: flex; align-items: center; gap: 14px; padding: 10px 14px; text-align: left; font-family: Manrope, sans-serif">
        <span style="width: 34px; height: 34px; border-radius: 11px; background: #2A2752; color: #C9B8FF; font-family: Sora, sans-serif; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0">7</span>
        <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 15px; font-weight: 700">Privacy</span>
          <span style="font-size: 12px; color: #B7B0DC">Theo gets no location, short brief</span>
        </span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C9B8FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 5l11 7-11 7z"></path></svg>
      </button>
  </div>
</div>
</body>
</html>
