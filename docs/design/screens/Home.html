      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 15px; font-weight: 600">Hearing protection</span>

    <button style="width: 100%; height: 72px; border-radius: 24px; border: none; background: #C9B8FF; color: #1A1638; font-family: Sora, sans-serif; font-size: 20px; font-weight: 600; letter-spacing: -0.01em; display: flex; align-items: center; justify-content: center; gap: 10px">

    <a href="Debug.html" style="font-size: 13px; font-weight: 600; padding: 10px 12px">Debug panel</a>
