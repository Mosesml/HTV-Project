name: Andy escalation foundation
on:
  push:
    branches: ['main', 'andy/**']
  pull_request:
permissions:
  contents: read
jobs:
  health:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
  fake-escalation:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - run: python3 scripts/check_escalation_fake.py
  motion-session:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path app/modules/raveguard-native/ios
