name: Andy QA
on:
  push:
    branches: ['main', 'andy/**']
  pull_request:
permissions:
  contents: read
jobs:
  server-qa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run qa
  fake-escalation:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - run: python3 scripts/check_escalation_fake.py
  motion-session:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path app/modules/raveguard-native/ios
  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and exercise deployment image
        shell: bash
        run: |
          set -euo pipefail
          docker build -t raveguard-qa server
          container=$(docker run -d -p 127.0.0.1::3000 raveguard-qa)
          trap 'docker logs "$container"; docker rm -f "$container" >/dev/null' EXIT
          port=$(docker port "$container" 3000/tcp | cut -d: -f2)
          base="http://127.0.0.1:$port"
          curl --fail --silent --show-error --max-time 2 --retry 20 --retry-all-errors --retry-max-time 30 --retry-delay 1 "$base/health"
          bash server/scripts/smoke-sessions.sh "$base"
          docker stop --time 15 "$container" >/dev/null
          test "$(docker inspect -f '{{.State.ExitCode}}' "$container")" = 0
