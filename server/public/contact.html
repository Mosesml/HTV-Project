<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Safety check</title>
<link rel="stylesheet" href="/contact-assets/contact.css">
</head>
<body>
<main>
  <div id="banner" class="banner" role="alert" hidden></div>
  <h1 id="heading">Loading…</h1>
  <p id="since" class="since"></p>
  <p id="brief" class="brief"></p>
  <p id="location" class="location" hidden><a id="map" rel="noopener noreferrer" target="_blank">Open location in Maps</a> <span id="accuracy"></span></p>
  <p id="status" class="status" aria-live="polite"></p>
  <div class="actions">
    <button id="ack" type="button" disabled>I'm on it</button>
    <button id="resolve" type="button" class="secondary" hidden>Mark resolved</button>
  </div>
  <p id="notice" class="notice" aria-live="polite"></p>
</main>
<script src="/contact-assets/contact.js" defer></script>
</body>
</html>
